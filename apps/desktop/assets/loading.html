    <title>DeepSeek Harness App</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8fa; color: #202229; }
      main { display: grid; justify-items: center; gap: 18px; }
      svg { width: 58px; height: 58px; color: #4d6bfe; }
      h1 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 620; letter-spacing: -0.02em; }
      p { margin: -8px 0 0; color: #737782; font-size: 13px; }
      .pulse { width: 112px; height: 2px; overflow: hidden; border-radius: 999px; background: #e1e4eb; }
      .pulse::after { content: ""; display: block; width: 44px; height: 100%; border-radius: inherit; background: #4d6bfe; animation: load 1.1s ease-in-out infinite; }
      @keyframes load { from { transform: translateX(-48px); } to { transform: translateX(116px); } }
      @media (prefers-color-scheme: dark) {
        body { background: #111318; color: #f2f3f5; }
        p { color: #969ba7; }
        .pulse { background: #292d36; }
      }
      @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; width: 100%; opacity: .7; } }
    </style>
